name: Build Windows release binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the Windows asset to
        required: true
        default: v4.0.0-beta.1
      source_ref:
        description: Branch or commit containing the build configuration
        required: true
        default: main

permissions:
  contents: write

jobs:
  build:
    name: windows-x86_64
    runs-on: windows-latest

    steps:
      - name: Check out build source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native Speex dependency
        shell: pwsh
        run: |
          vcpkg install speexdsp:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $installRoot = Join-Path $vcpkgRoot 'installed/x64-windows'
          "CPPFLAGS=-I$(Join-Path $installRoot 'include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LDFLAGS=-L$(Join-Path $installRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBRARY_PATH=$(Join-Path $installRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.16.0

      - name: Build the bundled DSP extension
        working-directory: dsp
        run: python build_dsp.py

      - name: Verify native audio extensions
        run: python -c "from speexdsp_ns import NoiseSuppression; from dsp import DSPChain; print('Speex and Kraken DSP imports succeeded')"

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm KrakenRelay.spec

      - name: Rename executable for release
        shell: bash
        run: mv "dist/KrakenRelay.exe" "KrakenRelay-windows-x86_64.exe"

      - name: Upload executable to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ inputs.tag }}" KrakenRelay-windows-x86_64.exe --clobber --repo "$GITHUB_REPOSITORY"
