name: Build release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true
        default: v4.0.0-beta.1
      source_ref:
        description: Branch or commit containing the build configuration
        required: true
        default: main

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: windows-x86_64
            extension: .exe
          - runner: ubuntu-22.04
            asset: linux-x86_64
            extension: ""
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
            extension: ""
          - runner: macos-13
            asset: macos-x86_64
            extension: ""
          - runner: macos-14
            asset: macos-arm64
            extension: ""

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native audio dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev libsndfile1-dev libspeexdsp-dev

      - name: Install native audio dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install portaudio libsndfile speexdsp

      - name: Install native Speex dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install speexdsp:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $installRoot = Join-Path $vcpkgRoot 'installed/x64-windows'
          "CPPFLAGS=-I$(Join-Path $installRoot 'include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LDFLAGS=-L$(Join-Path $installRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBRARY_PATH=$(Join-Path $installRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$(Join-Path $installRoot 'bin');$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.16.0

      - name: Build the bundled DSP extension
        working-directory: dsp
        run: python build_dsp.py

      - name: Verify native audio extensions
        run: python -c "from speexdsp_ns import NoiseSuppression; from dsp import DSPChain; print('Speex and Kraken DSP imports succeeded')"

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm KrakenRelay.spec

      - name: Rename executable for release
        shell: bash
        run: mv "dist/KrakenRelay${{ matrix.extension }}" "KrakenRelay-${{ matrix.asset }}${{ matrix.extension }}"

      - name: Upload executable to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "KrakenRelay-${{ matrix.asset }}${{ matrix.extension }}" --clobber --repo "$GITHUB_REPOSITORY"
