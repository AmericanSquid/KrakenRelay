name: Build macOS Intel release binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the macOS Intel asset to
        required: true
        default: v4.0.0-beta.1
      source_ref:
        description: Branch or commit containing the build configuration
        required: true
        default: main

permissions:
  contents: write

jobs:
  build:
    name: macos-x86_64
    runs-on: macos-15-intel

    steps:
      - name: Check out build source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native audio dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install portaudio libsndfile speexdsp

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.16.0

      - name: Build the bundled DSP extension
        working-directory: dsp
        run: python build_dsp.py

      - name: Verify native audio extensions
        run: python -c "from speexdsp_ns import NoiseSuppression; from dsp import DSPChain; print('Speex and Kraken DSP imports succeeded')"

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm KrakenRelay.spec

      - name: Rename executable for release
        run: mv "dist/KrakenRelay" "KrakenRelay-macos-x86_64"

      - name: Upload executable to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" KrakenRelay-macos-x86_64 --clobber --repo "$GITHUB_REPOSITORY"
